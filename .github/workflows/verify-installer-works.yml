name: Build and Verify Installer Works

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Step 2: Set up Go
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'

      # Step 3: Install htmgo CLI from local source
      - name: Install htmgo CLI
        run: |
          cd cli/htmgo && go install .

      # Step 4: Generate template from the local checkout.
      # We copy templates/starter instead of running `htmgo template` (which
      # clones master from GitHub and would miss changes on this branch).
      - name: Generate myapp template
        # GOWORK=off so myapp (generated inside the monorepo tree in CI)
        # is treated as a standalone module — a real downstream consumer
        # would not be inside our workspace. Without this, the root
        # go.work would cause "current directory is contained in a
        # module that is not one of the workspace modules".
        env:
          GOWORK: 'off'
        run: |
          cp -r templates/starter myapp
          cd myapp
          sed -i 's/module starter-template/module myapp/' go.mod
          sed -i 's|../../framework|../framework|' go.mod
          find . -name '*.go' -exec sed -i 's/starter-template/myapp/g' {} +
          git init
          go mod tidy
          htmgo generate

      # Step 5: Build the app
      - name: Build myapp
        env:
          GOWORK: 'off'
        run: |
          cd myapp
          htmgo build

      - name: Verify the standalone binary serves its page and embedded assets
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/myapp/dist/myapp" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3000/ -o index.html
          for asset in htmgo.js main.css; do
            curl --fail "http://localhost:3000/public/$asset" -o "$asset"
            cmp "$asset" "$GITHUB_WORKSPACE/myapp/assets/dist/$asset"
          done

  verify-public-install:
    # Runs on push to master after tags are published. Confirms the
    # public install path works. Do not run on PRs — the tag may not
    # exist yet for the version being shipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'

      - name: Install htmgo CLI from public module proxy
        run: |
          GOPROXY=https://proxy.golang.org,direct \
            go install github.com/franchb/htmgo/cli/htmgo/v2@latest

      - name: Verify CLI binary runs
        run: |
          htmgo version
