name: Update HTMGO Framework Dependency

on:
  workflow_dispatch:  # Trigger on manual workflow_dispatch
  push:
    branches:
      - master         # Trigger on pushes to master
    paths:
      - 'framework/**'
      - 'tools/html-to-htmgo/**'

permissions:
  contents: read

jobs:
  update-htmgo-dep:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the version bump to master

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Necessary to avoid using the runner's credentials for commit
          fetch-depth: 0  # Full history for committing back changes

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must satisfy go.work (go 1.27.0); ">=1.20" resolved to 1.26.8 and the
          # script failed with "go.work requires go >= 1.27.0".
          go-version: '1.27'

      - name: Run update-htmgo-dep.go script
        run: go run tools/update-htmgo-dep.go

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Auto-update HTMGO framework version" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git master)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
