name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # only-new-issues reads the PR diff
    strategy:
      fail-fast: false
      matrix:
        module:
          - framework
          - framework-ui
          - cli/htmgo
          - extensions/websocket
          - tools/html-to-htmgo
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build from source with the Go set up above: golangci-lint refuses
          # to lint modules targeting a newer Go than it was built with, and
          # the modules require go 1.27.0.
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          # Existing findings (mostly errcheck in cli/htmgo) are a backlog;
          # fail only on issues introduced by the change under review.
          only-new-issues: true
