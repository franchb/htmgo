name: Build and Deploy starter template

on:
  workflow_run:
    workflows: [ "Update HTMGO Framework Dependency" ]  # The name of the first workflow
    types:
      - completed
  workflow_dispatch:  # Trigger on manual workflow_dispatch
  push:
    branches:
      - master         # Trigger on pushes to master
    paths:
      - 'templates/starter/**'  # Trigger only if files in this directory change
  pull_request:  # Build only (no push) to check the Dockerfile
    paths:
      - 'templates/starter/**'
      - '.github/workflows/release-starter-template.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # templates/starter/Dockerfile ships to users via `htmgo template`, so it
      # keeps the project directory as context; the framework comes in as a
      # named build context from this commit.
      - name: Build and push Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/starter-template
          PUSH: ${{ github.event_name != 'pull_request' && '--push' || '' }}
        run: |
          docker buildx build \
            --build-context framework=framework \
            $PUSH \
            -t "$IMAGE:${{ steps.vars.outputs.short_sha }}" \
            -t "$IMAGE:latest" \
            templates/starter
