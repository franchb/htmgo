version: 2
updates:
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "deps(framework):"
    directory: "framework"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "deps(framework-ui):"
    directory: "framework-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "deps(cli):"
    directory: "cli/htmgo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "deps(extensions/websocket):"
    directory: "extensions/websocket"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: "gomod"
    commit-message:
      prefix: "deps(tools/html-to-htmgo):"
    directory: "tools/html-to-htmgo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  # No gomod entries for htmgo-site, templates/starter or examples/*: they
  # import their generated, gitignored __htmgo package, so Dependabot's
  # `go get` fails with "package <app>/__htmgo is not in std". Their framework
  # dependency is kept current by the update-framework-dep workflow.
  - package-ecosystem: "npm"
    commit-message:
      prefix: "deps(framework/assets/js):"
    directory: "framework/assets/js"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "htmgo-site" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "deps:"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
